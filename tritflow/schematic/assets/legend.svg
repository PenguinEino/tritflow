<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="624" viewBox="0 0 1088 624" role="img" aria-label="Balanced-ternary symbol legend">
<title>Balanced-ternary symbol legend</title>
<desc>Left-to-right balanced-ternary logic. Dots mark connected branches; gaps at crossings mean no connection. All values are settled ideal trits.</desc>
<rect width="100%" height="100%" fill="white"/>
