<text fill="#172033"  xml:space="preserve" font-size="14.0995" transform="translate(40.6718, 39.9169)" >BALANCED TERNARY FULL ADDER / HA x2 + NANY + INV</text>
<text fill="#172033"  xml:space="preserve" font-size="8.81221" transform="translate(40.6718, 75.7877)" >a + b + cin = sum + 3*cout.  Logic -1 / 0 / +1 = -5 / 0 / +5 V.</text>
<text fill="#172033"  xml:space="preserve" font-size="8.81221" transform="translate(115.237, 380.826)" >HA1: a + b = s1 + 3*c1</text>
<text fill="#172033"  xml:space="preserve" font-size="8.81221" transform="translate(454.168, 380.826)" >HA2: s1 + cin = sum + 3*c2</text>
<text fill="#172033"  xml:space="preserve" font-size="9.86968" transform="translate(40.6718, 463.13)" >CARRY MERGE: cout = ANY(c1,c2) = INV(NANY(c1,c2))</text>
<text fill="#172033"  xml:space="preserve" font-size="8.81221" transform="translate(40.6718, 672.307)" >For valid inputs, c1 and c2 cannot both be +1 or both be -1.</text>
<text fill="#172033"  xml:space="preserve" font-size="8.81221" transform="translate(40.6718, 699.421)" >Thus sat(c1+c2) = c1+c2 and a+b+cin = sum+3*cout.</text>
<text fill="#172033"  xml:space="preserve" font-size="8.81221" transform="translate(40.6718, 821.437)" >VDD = +5 V; VSS = -5 V; VMID = 0 V. No internal load capacitors.</text>
<text fill="#172033"  xml:space="preserve" font-size="8.81221" transform="translate(40.6718, 848.551)" >Hierarchy: full_adder -&gt; half_adder -&gt; nany / inverter. Total: NANY x11 + INV x5.</text>
</svg>
