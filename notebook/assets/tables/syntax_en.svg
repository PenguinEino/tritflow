<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700.8" viewBox="0 0 640 700.8" font-family="Times New Roman, Times, Nimbus Roman, Liberation Serif, Noto Serif JP, Noto Serif CJK JP, Hiragino Mincho ProN, serif"><g transform="translate(0,0)"><path d="M0,1 H640 M0,699.8 H640" stroke="#0b0b0b" stroke-width="1.4"/><path d="M0,62.4 H640" stroke="#0b0b0b" stroke-width=".8"/><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b" font-weight="700"><tspan x="10" y="37.8">Syntax</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b" font-weight="700"><tspan x="200" y="37.8">Meaning</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b" font-weight="700"><tspan x="460" y="26.2">Synthesized </tspan><tspan x="460" y="49.4">circuit</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="98.2">~a  a &amp; b  a | b</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="86.6">Negation, minimum (min),</tspan><tspan x="200" y="109.8"> maximum (max)</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="86.6">INV, NAND + INV, </tspan><tspan x="460" y="109.8">NOR + INV</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="147">nany(a, b)</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="147">−sat(a + b)</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="147">NANY</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="195.8">a + b  a - b  -a</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="184.2">Integer addition, </tspan><tspan x="200" y="207.4">subtraction, negation</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="184.2">Full-adder chain;</tspan><tspan x="460" y="207.4"> INV per digit</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="267.8">a * b</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="267.8">Integer multiplication</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="244.6">One-trit </tspan><tspan x="460" y="267.8">multipliers and </tspan><tspan x="460" y="291">adders</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="351.4">a &lt;&lt; 1  a &gt;&gt; 1</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="328.2">Multiply by 3; divide by</tspan><tspan x="200" y="351.4"> 3 and round to the </tspan><tspan x="200" y="374.6">nearest integer</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="339.8">Rewiring (no </tspan><tspan x="460" y="363">cells)</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="435">a == b  a &lt; b</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="423.4">Comparison: true +1, </tspan><tspan x="200" y="446.6">false −1</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="411.8">Per-digit </tspan><tspan x="460" y="435">differences and </tspan><tspan x="460" y="458.2">sign detection</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="530.2">c ? x : y</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="495.4">x for c = +1, y for −1; </tspan><tspan x="200" y="518.6">at 0, retain matching </tspan><tspan x="200" y="541.8">digits and set others to</tspan><tspan x="200" y="565"> 0</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="530.2">Ternary selector</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="613.8">always @*  if  case</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="602.2">Procedural combinational</tspan><tspan x="200" y="625.4"> logic</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="602.2">Conditional value</tspan><tspan x="460" y="625.4"> selectors</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="674.2">inv g (y, a);</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="662.6">Direct cell </tspan><tspan x="200" y="685.8">instantiation</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="662.6">The specified </tspan><tspan x="460" y="685.8">cell</tspan></text></g></svg>
