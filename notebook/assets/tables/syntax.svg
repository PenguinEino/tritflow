<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="344" viewBox="0 0 1020 344" font-family="Times New Roman, Times, Nimbus Roman, Liberation Serif, Noto Serif JP, Hiragino Mincho ProN, serif"><g transform="translate(0,0)"><path d="M0,1 H1020 M0,343 H1020" stroke="#0b0b0b" stroke-width="1.4"/><path d="M0,36 H1020" stroke="#0b0b0b" stroke-width=".8"/><text x="10" y="25.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b" font-weight="700">書き方</text><text x="260" y="25.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b" font-weight="700">意味</text><text x="730" y="25.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b" font-weight="700">合成される回路</text><text x="10" y="59.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" xml:space="preserve" text-anchor="start" fill="#0b0b0b">~a  a &amp; b  a | b</text><text x="260" y="59.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">符号反転、小さいほう（min）、大きいほう（max）</text><text x="730" y="59.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">INV、NAND＋INV、NOR＋INV</text><text x="10" y="93.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" xml:space="preserve" text-anchor="start" fill="#0b0b0b">nany(a, b)</text><text x="260" y="93.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">−sat(a + b)</text><text x="730" y="93.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">NANY</text><text x="10" y="127.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" xml:space="preserve" text-anchor="start" fill="#0b0b0b">a + b  a - b  -a</text><text x="260" y="127.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">整数の加算、減算、符号反転</text><text x="730" y="127.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">全加算器の連鎖、各桁のINV</text><text x="10" y="161.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" xml:space="preserve" text-anchor="start" fill="#0b0b0b">a * b</text><text x="260" y="161.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">整数の乗算</text><text x="730" y="161.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">1トリットの乗算器と加算器</text><text x="10" y="195.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" xml:space="preserve" text-anchor="start" fill="#0b0b0b">a &lt;&lt; 1  a &gt;&gt; 1</text><text x="260" y="195.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">3倍、3で割って最も近い整数に丸める</text><text x="730" y="195.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">配線のつなぎ替え（セルなし）</text><text x="10" y="229.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" xml:space="preserve" text-anchor="start" fill="#0b0b0b">a == b  a &lt; b</text><text x="260" y="229.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">比較。真は +1、偽は −1</text><text x="730" y="229.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">各桁の差と符号の判定</text><text x="10" y="263.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" xml:space="preserve" text-anchor="start" fill="#0b0b0b">c ? x : y</text><text x="260" y="263.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">c = +1 で x、−1 で y、0 では一致する桁を残し他は 0</text><text x="730" y="263.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">三値の選択回路</text><text x="10" y="297.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" xml:space="preserve" text-anchor="start" fill="#0b0b0b">always @*  if  case</text><text x="260" y="297.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">手続き的に書く組合せ回路</text><text x="730" y="297.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">条件ごとの値を選ぶ回路</text><text x="10" y="331.3" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" xml:space="preserve" text-anchor="start" fill="#0b0b0b">inv g (y, a);</text><text x="260" y="331.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">セルを直接置く</text><text x="730" y="331.3" font-size="18" xml:space="preserve" text-anchor="start" fill="#0b0b0b">そのセル</text></g></svg>
