<svg xmlns="http://www.w3.org/2000/svg" width="640" height="515.2" viewBox="0 0 640 515.2" font-family="Times New Roman, Times, Nimbus Roman, Liberation Serif, Noto Serif JP, Noto Serif CJK JP, Hiragino Mincho ProN, serif"><g transform="translate(0,0)"><path d="M0,1 H640 M0,514.2 H640" stroke="#0b0b0b" stroke-width="1.4"/><path d="M0,39.2 H640" stroke="#0b0b0b" stroke-width=".8"/><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b" font-weight="700"><tspan x="10" y="26.2">書き方</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b" font-weight="700"><tspan x="200" y="26.2">意味</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b" font-weight="700"><tspan x="460" y="26.2">合成される回路</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="75">~a  a &amp; b  a | b</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="63.4">符号反転、小さいほう（min）、</tspan><tspan x="200" y="86.6">大きいほう（max）</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="63.4">INV、NAND＋INV、</tspan><tspan x="460" y="86.6">NOR＋INV</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="123.8">nany(a, b)</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="123.8">−sat(a + b)</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="123.8">NANY</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="172.6">a + b  a - b  -a</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="172.6">整数の加算、減算、符号反転</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="161">全加算器の連鎖、各桁</tspan><tspan x="460" y="184.2">のINV</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="233">a * b</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="233">整数の乗算</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="221.4">1トリットの乗算器と加</tspan><tspan x="460" y="244.6">算器</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="293.4">a &lt;&lt; 1  a &gt;&gt; 1</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="281.8">3倍、3で割って最も近い整数に</tspan><tspan x="200" y="305">丸める</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="281.8">配線のつなぎ替え（セ</tspan><tspan x="460" y="305">ルなし）</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="342.2">a == b  a &lt; b</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="342.2">比較。真は +1、偽は −1</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="342.2">各桁の差と符号の判定</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="391">c ? x : y</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="379.4">c = +1 で x、−1 で y、0 で</tspan><tspan x="200" y="402.6">は一致する桁を残し他は 0</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="391">三値の選択回路</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="451.4">always @*  if  case</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="451.4">手続き的に書く組合せ回路</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="439.8">条件ごとの値を選ぶ回</tspan><tspan x="460" y="463">路</tspan></text><text font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="13" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="10" y="500.2">inv g (y, a);</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="200" y="500.2">セルを直接置く</tspan></text><text font-size="16" xml:space="preserve" text-anchor="start" fill="#0b0b0b"><tspan x="460" y="500.2">そのセル</tspan></text></g></svg>
